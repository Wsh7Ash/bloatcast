[project]
name = "bloatcast"
version = "0.1.0"
description = "Turn a PostgreSQL table-statistics export into vacuum triggers, dead-space estimates and per-table autovacuum settings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.scripts]
bloatcast = "bloatcast.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
